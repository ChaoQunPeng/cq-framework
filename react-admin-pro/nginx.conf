server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose 中的 api 服务提供管理接口，服务名由 compose.yml 保证可解析。
    location ^~ /api/admin/ {
        proxy_pass http://api:3000;
    }

    # 公共接口（如 /api/common/upload 图片上传）同样转发给 Nest API 服务。
    location ^~ /api/common/ {
        proxy_pass http://api:3000;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:3000;
    }

    # Umi 使用浏览器路由，未命中静态文件时返回入口页面。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
